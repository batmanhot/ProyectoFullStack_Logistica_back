name: Backup nocturno

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC ≈ 01:17 America/Lima
  workflow_dispatch: {} # permite dispararlo a mano

concurrency:
  group: backup-nightly
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }} # External URL, rol dueño
      BACKUP_API_URL: ${{ secrets.BACKUP_API_URL }}
      BACKUP_INGEST_TOKEN: ${{ secrets.BACKUP_INGEST_TOKEN }}
      BACKUP_STORAGE_BUCKET: ${{ secrets.BACKUP_STORAGE_BUCKET }}
      BACKUP_STORAGE_ENDPOINT: ${{ secrets.BACKUP_STORAGE_ENDPOINT }}
      BACKUP_STORAGE_KEY_ID: ${{ secrets.BACKUP_STORAGE_KEY_ID }}
      BACKUP_STORAGE_SECRET: ${{ secrets.BACKUP_STORAGE_SECRET }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          # postgresql-client "a secas" instala la v16 por defecto en
          # ubuntu-latest — pg_dump se niega a volcar un servidor MÁS NUEVO
          # que él mismo (confirmado 2026-09-14: Render corre Postgres 18,
          # pg_dump 16 tira "aborting because of server version mismatch").
          # El repo apt.postgresql.org ya viene configurado en el runner
          # (de ahí que el 16 resuelto tuviera sufijo "pgdg24.04"), así que
          # alcanza con pedir la versión 18 explícita — sin agregar repos.
          sudo apt-get install -y postgresql-client-18 age
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          # npm 10.x (el que trae Node 22) rechaza `npm ci` por un peer
          # opcional de @prisma/config>c12 que valida distinto que npm 11.x —
          # confirmado 2026-09-14, es una diferencia de versión de npm, no
          # del lockfile (con npm 11 el mismo package-lock.json instala limpio).
          npm install -g npm@11
          npm ci
          npm i --no-save @aws-sdk/client-s3
          npx prisma generate

      - name: Verificar cobertura del backup por tenant
        run: node scripts/backup/check-coverage.mjs

      - name: pg_dump completo (DR)
        run: node scripts/backup/backup-full.mjs

      - name: Export por tenant (todos los negocios activos)
        run: node scripts/backup/backup-tenant.mjs --all
