name: Restaurar un negocio (manual)

# Disparado por el panel SuperAdmin (POST /admin/backups/restauraciones/:id/ejecutar,
# ver GithubActionsService) cuando una SolicitudRestauracion pasa a EN_EJECUCION.
# También se puede correr a mano desde Actions → Run workflow.
#
# SIN schedule, a propósito: esto borra y reinserta datos de producción de UN
# negocio (scripts/backup/restore-tenant.mjs --apply). No confundir con
# backup-restore-test.yml (mensual, restaura el dump completo en una Postgres
# efímera de prueba — nunca toca producción).

on:
  workflow_dispatch:
    inputs:
      solicitud_id:
        description: 'ID de la SolicitudRestauracion (estado APROBADA o EN_EJECUCION)'
        required: true
        type: string
      confirmacion:
        description: 'Escribí RESTAURAR para confirmar — operación destructiva'
        required: true
        type: string

concurrency:
  group: backup-restore-tenant
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }} # External URL, rol dueño
      BACKUP_API_URL: ${{ secrets.BACKUP_API_URL }}
      BACKUP_INGEST_TOKEN: ${{ secrets.BACKUP_INGEST_TOKEN }}
      BACKUP_STORAGE_BUCKET: ${{ secrets.BACKUP_STORAGE_BUCKET }}
      BACKUP_STORAGE_ENDPOINT: ${{ secrets.BACKUP_STORAGE_ENDPOINT }}
      BACKUP_STORAGE_KEY_ID: ${{ secrets.BACKUP_STORAGE_KEY_ID }}
      BACKUP_STORAGE_SECRET: ${{ secrets.BACKUP_STORAGE_SECRET }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }} # cifra el snapshot previo
      BACKUP_AGE_IDENTITY_FILE: age-key.txt # descifra el export del tenant
    steps:
      - name: Validar disparo
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Solo se permite disparar este workflow desde main (ref actual: ${{ github.ref_name }})"; exit 1
          fi
          if [ "${{ inputs.confirmacion }}" != "RESTAURAR" ]; then
            echo "Confirmación inválida — se esperaba el texto exacto RESTAURAR"; exit 1
          fi
          if ! echo "${{ inputs.solicitud_id }}" | grep -Eq '^[a-z0-9]{20,32}$'; then
            echo "solicitud_id con forma inválida"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          # Ver nota en backup-nightly.yml — pg_dump 16 (default de apt) no
          # puede volcar la Postgres 18 de Render.
          sudo apt-get install -y postgresql-client-18 age
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          # Ver nota en backup-nightly.yml — npm 10.x rechaza `npm ci` por un
          # peer opcional de @prisma/config>c12, npm 11.x no.
          npm install -g npm@11
          npm ci
          npm i --no-save @aws-sdk/client-s3
          npx prisma generate

      - name: Escribir clave age
        run: printf '%s' "${{ secrets.BACKUP_AGE_IDENTITY }}" > age-key.txt

      - name: Dry-run (valida el backup antes de tocar nada)
        run: node scripts/backup/restore-tenant.mjs --solicitud "${{ inputs.solicitud_id }}"

      - name: Restaurar (destructivo — snapshot previo + reemplazo)
        run: node scripts/backup/restore-tenant.mjs --solicitud "${{ inputs.solicitud_id }}" --apply --url "$DATABASE_URL"

      - name: Reportar fallo de infraestructura al panel
        if: failure()
        run: |
          curl -sS -X POST "$BACKUP_API_URL/admin/backups/ingest/restauracion-resultado" \
            -H 'Content-Type: application/json' -H "X-Backup-Token: $BACKUP_INGEST_TOKEN" \
            -d "{\"solicitudId\":\"${{ inputs.solicitud_id }}\",\"resultado\":\"fallo\",\"log\":\"El job de GitHub Actions falló antes o durante la restauración. Ver ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
