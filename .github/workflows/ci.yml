name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # prisma.service.spec.ts abre una transacción real (withTenant -> $transaction)
    # para probar que rechaza un empresaId malicioso ANTES de ejecutar el SET
    # LOCAL — pero Prisma necesita conectar de verdad para siquiera abrir esa
    # transacción, así que hace falta una Postgres alcanzable (no le importa el
    # esquema/las migraciones, nunca llega a tocar ninguna tabla real). Mismo
    # patrón que ya usa backup-restore-test.yml.
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      APP_DATABASE_URL: postgres://postgres:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 10.x (el que trae Node 22 por defecto) rechaza `npm ci` con
      # "Missing: magicast@0.3.5 from lock file" — un peer opcional de
      # @prisma/config>c12 que ese npm valida más estricto que npm 11.x.
      # Confirmado 2026-09-14: con npm 11 el mismo package-lock.json instala
      # limpio (exit 0); es una diferencia de versión de npm, no del lockfile.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:cov
